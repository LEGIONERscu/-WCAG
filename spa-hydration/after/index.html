<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-модалка — приклад (AFTER)</title>
<style>
  /* Виправлено: власний видимий focus-ring замість outline:none. */
  #open-modal:focus {
    outline: none;
    box-shadow: 0 0 0 3px #1d6cff;
  }

  header.site-header {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 72px;
    background: #ffffff;
    z-index: 10;
  }
  main { margin-top: 80px; padding: 0 16px; }

  /* Виправлено: посилання більше не лежить під хедером — звичайний потік,
     margin-top на <main> уже дає достатній відступ. */
  #under-header-link { display: inline-block; }

  [role="dialog"] { border: 1px solid #333; padding: 16px; margin-top: 24px; }
</style>
</head>
<body>
  <header class="site-header">
    <nav><a href="#main">Меню</a></nav>
  </header>

  <main id="main">
    <a id="under-header-link" href="#x">Посилання під хедером</a>

    <h1>Клієнтський SPA-віджет</h1>
    <button id="open-modal" type="button">Відкрити модальне вікно</button>

    <!-- Виправлено: Escape реально закриває модалку (не лише семантика
         role="dialog"), фокус коректно виходить за межі модалки. -->
    <div role="dialog" aria-modal="true" id="modal">
      <h2>Підписка на новини</h2>
      <input id="modal-input" type="email" placeholder="your@email.com">
      <button type="button" id="modal-close" onclick="closeModal()">Закрити</button>
    </div>
  </main>

  <script>
    function closeModal() {
      document.getElementById('modal').remove();
      document.getElementById('open-modal').focus();
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('modal')) closeModal();
    });
  </script>
</body>
</html>
