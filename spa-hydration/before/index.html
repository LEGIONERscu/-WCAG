<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-модалка — приклад (BEFORE)</title>
<style>
  /* Дефект: keyboard-no-focus-indicator — outline прибрано, інших
     візуальних змін при фокусі немає. */
  #open-modal:focus { outline: none; }

  header.site-header {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 72px;
    background: #ffffff;
    z-index: 10;
  }
  main { margin-top: 80px; padding: 0 16px; }

  /* Дефект: focus-obscured-minimum — цей лінк геометрично лежить під
     fixed-хедером (z-index нижчий), хоча формально в звичайному
     tab-порядку. */
  #under-header-link {
    position: absolute;
    top: 10px; left: 10px;
    z-index: 1;
  }

  [role="dialog"] { border: 1px solid #333; padding: 16px; margin-top: 24px; }
</style>
</head>
<body>
  <header class="site-header">
    <nav><a href="#main">Меню</a></nav>
  </header>

  <a id="under-header-link" href="#x">Посилання під хедером</a>

  <main id="main">
    <h1>Клієнтський SPA-віджет</h1>
    <button id="open-modal" type="button">Відкрити модальне вікно</button>

    <!-- Відображена одразу (не за кліком) — статичний fixture-файл не
         відтворює реальну hydration-подію "відкрити", модал просто вже
         у DOM, останнім у природному tab-порядку (сканер дістається сюди
         Tab'ом з початку сторінки). Дефект: keyboard-trap — фокус
         примусово повертається на той самий елемент при blur, і НЕМАЄ
         обробника Escape (role="dialog" саме по собі не рятує — SKILL.md,
         "не довіряти голій семантиці"). -->
    <div role="dialog" aria-modal="true" id="modal">
      <h2>Підписка на новини</h2>
      <input id="modal-input" type="email" placeholder="your@email.com"
             onblur="this.focus()">
      <button type="button" onclick="document.getElementById('modal').remove();">Закрити</button>
    </div>
  </main>
</body>
</html>
